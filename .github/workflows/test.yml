name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 29.1 is the minimum in Package-Requires.
        emacs-version: ['29.1', '30.2', '31.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install mpv
        run: sudo apt-get update && sudo apt-get install -y mpv

      # Fail instead of silently skipping the mpv tests.
      - name: Check mpv
        run: mpv --version

      - name: Byte-compile
        run: emacs --batch -Q -L . --eval "(setq byte-compile-error-on-warn t)" -f batch-byte-compile media-bookmark.el media-bookmark-mpv.el test/media-bookmark-test.el

      - name: Run tests
        run: emacs --batch -Q -L . -l test/media-bookmark-test.el -f ert-run-tests-batch-and-exit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@v8.0
        with:
          version: '31.1'

      - name: Install package-lint
        run: |
          emacs --batch -Q --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (package-initialize)
            (package-refresh-contents)
            (package-install 'package-lint))"

      - name: package-lint
        run: emacs --batch -Q --eval "(progn (package-initialize) (require 'package-lint) (setq package-lint-main-file \"media-bookmark.el\"))" -f package-lint-batch-and-exit media-bookmark.el media-bookmark-mpv.el

      # checkdoc only prints warnings, so fail if it prints anything.
      - name: checkdoc
        run: |
          for f in media-bookmark.el media-bookmark-mpv.el; do
            out=$(emacs --batch -Q --eval "(checkdoc-file \"$f\")" 2>&1)
            if [ -n "$out" ]; then echo "$out"; exit 1; fi
          done
